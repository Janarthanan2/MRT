server:
  port: 8080
spring:
  application:
    name: mrt-backend
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/mrt;MODE=MySQL;AUTO_SERVER=TRUE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  h2:
    console:
      enabled: true
mrt:
  cors-origins: ${CORS_ORIGINS:http://localhost:5173}
  admin-email: ${ADMIN_EMAIL:admin@mrtmetalmart.in}
  admin-password: ${ADMIN_PASSWORD:admin123}
