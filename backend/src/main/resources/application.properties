server.port=8080
spring.application.name=mrt-backend

# MySQL is the canonical runtime database. Configure credentials via environment.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mrt_metal_mart?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true}
spring.datasource.username=${DATABASE_USERNAME:mrt_app}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=never

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jackson.serialization.write-dates-as-timestamps=false
mrt.jwt.secret=${JWT_SECRET}
mrt.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
mrt.cors-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:4173}
mrt.ml.base-url=${ML_SERVICE_URL:http://localhost:8000}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB
