# TEMP DEFAULT ADMIN LOGIN (change/remove later)
# Email: admin@mrtmetalmart.in
# Password: admin123
server.port=8080
spring.application.name=mrt-backend
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/mrt;MODE=MySQL;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.sql.init.mode=always
spring.jpa.open-in-view=false
spring.jackson.serialization.write-dates-as-timestamps=false
mrt.jwt.secret=${JWT_SECRET:change-this-secret-to-a-long-random-value-for-production-only}
mrt.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
mrt.cors-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:4173}
mrt.admin-email=${ADMIN_EMAIL:admin@mrtmetalmart.in}
mrt.admin-password=${ADMIN_PASSWORD:admin123}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB
