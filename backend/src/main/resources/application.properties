server.port=8080
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mrt_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
mrt.jwt.secret=${JWT_SECRET:change-this-secret-to-a-long-random-value-for-production}
mrt.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB