spring:
  datasource:
    url: jdbc:mysql://localhost:3306/mrt_metal_mart?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
    username: ${DATABASE_USERNAME:mrt_app}
    password: ${DATABASE_PASSWORD:CHANGE_THIS_STRONG_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

mrt:
  ml:
    base-url: ${ML_SERVICE_URL:http://localhost:8000}