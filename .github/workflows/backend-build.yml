name: Build MRT Backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
  pull_request:
    paths:
      - "backend/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SPRING_PROFILES_ACTIVE: test
      JWT_SECRET: ci-test-secret-key-at-least-32-bytes-long
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Run unit tests, compile, and package the backend on every change.
      - run: mvn -B verify

  mysql-integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root-test-password
          MYSQL_DATABASE: mrt_it
          MYSQL_USER: mrt_it
          MYSQL_PASSWORD: mrt_it_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot-test-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Validate Flyway migrations against disposable MySQL
        env:
          MYSQL_IT_URL: jdbc:mysql://127.0.0.1:3306/mrt_it?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
          MYSQL_IT_USERNAME: mrt_it
          MYSQL_IT_PASSWORD: mrt_it_password
        run: mvn -B -Dtest=FlywayMySqlIntegrationTest test
